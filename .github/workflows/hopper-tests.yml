name: Hopper tests

on:
  push:
    paths:
      - "hopper/**"
      - ".github/workflows/hopper-tests.yml"
  pull_request:
    paths:
      - "hopper/**"
      - ".github/workflows/hopper-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hopper-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hopper
    env:
      # Offline: no live feeds, no Claude, no keys — the suite uses sample payloads and mocks.
      HOPPER_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hopper/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider tests
